name: Phase one cutover
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.17.4
      - run: python -m coverage run --branch --source scripts -m unittest discover -s scripts -p test_phase_one_cutover.py
      - run: python -m coverage report --include '*/phase-one-cutover.py' --fail-under=100
