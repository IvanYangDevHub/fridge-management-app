services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__FreshDays: ${ConnectionStrings__FreshDays:?Set ConnectionStrings__FreshDays in .env}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?Set LINE_CHANNEL_SECRET in .env}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?Set LINE_CHANNEL_ACCESS_TOKEN in .env}
      HOUSEHOLD_CODE: ${HOUSEHOLD_CODE:-}
      Product__PhaseTwo: ${Product__PhaseTwo:-false}
      Auth__GoogleClientId: ${Auth__GoogleClientId:-}
      Auth__LegacyOwnerEmail: ${Auth__LegacyOwnerEmail:-}
    volumes:
      - ./certs:/etc/freshdays/certs:ro

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
